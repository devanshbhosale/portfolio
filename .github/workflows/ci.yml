name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
        env:
      # Supabase URL + anon key are public by design (same pair deployed on site/exe)
      NEXT_PUBLIC_SUPABASE_URL: https://qqvsqjpcstkdurrgxznr.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxdnNxanBjc3RrZHVycmd4em5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTQ4MTUsImV4cCI6MjA5MzY3MDgxNX0.eT5nKPk1kV5mqrXVmQSOk9APlafyLTFhwevprA7GIG8
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      RAZORPAY_KEY_ID: placeholder-key-id
      RAZORPAY_KEY_SECRET: placeholder-key-secret
      NEXT_PUBLIC_RAZORPAY_KEY_ID: placeholder-key-id
      CRON_SECRET: placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (money math)
        run: npx vitest run

      - name: Build
        run: npm run build
