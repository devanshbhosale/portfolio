name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Public-website mode: dashboards 404. Placeholders are enough for build.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      RAZORPAY_KEY_ID: placeholder-key-id
      RAZORPAY_KEY_SECRET: placeholder-key-secret
      NEXT_PUBLIC_RAZORPAY_KEY_ID: placeholder-key-id
      CRON_SECRET: placeholder-cron-secret
      ENABLE_DASHBOARDS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (money math)
        run: npx vitest run

      - name: Build (public mode)
        run: npm run build
