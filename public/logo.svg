<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jk-dark-bg" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E2442"/>
      <stop offset="100%" stop-color="#071324"/>
    </linearGradient>
    <linearGradient id="jk-orange" x1="22" y1="10" x2="38" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9B26"/>
      <stop offset="100%" stop-color="#FF5100"/>
    </linearGradient>
    <linearGradient id="jk-blue" x1="22" y1="24" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 24px;
        fill: #FFFFFF;
        letter-spacing: -0.04em;
      }
      .brand-accent {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 24px;
        fill: #3B82F6;
        letter-spacing: -0.03em;
      }
    </style>
  </defs>

  <!-- Kinetic JK Monogram Mark -->
  <g transform="translate(2, 2)">
    <rect width="44" height="44" rx="12" fill="url(#jk-dark-bg)" stroke="#1F3E68" stroke-width="1.2"/>
    
    <!-- J Architectural Spine -->
    <path d="M13 11H18.5V26.5C18.5 30.6421 15.1421 34 11 34C8.79086 34 7 32.2091 7 30C7 27.7909 8.79086 26 11 26C12.1046 26 13 26.8954 13 28V11Z" fill="#FFFFFF"/>
    
    <!-- K Upper Launch Arrow (Velocity) -->
    <polygon points="21.5,19 33.5,11 36.5,15.5 25.5,22.5" fill="url(#jk-orange)"/>
    
    <!-- K Lower Strut (Stability) -->
    <polygon points="22,25 26,23.5 36,33.5 32,36.5" fill="url(#jk-blue)"/>
    
    <!-- Energy Spark Core -->
    <circle cx="20.5" cy="22" r="2.2" fill="#FFA424"/>
  </g>

  <!-- Wordmark Lockup -->
  <g transform="translate(56, 32)">
    <text class="brand-title">Job</text>
    <text x="44" class="brand-accent">karbe</text>
    <circle cx="118" cy="-6" r="3" fill="#FF5100"/>
  </g>
</svg>
